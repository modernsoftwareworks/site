
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="oklch(14% 0.012 240)" />
  <meta name="description" content="Modern Software Works. A small studio that builds software meant to last." />
  <title>Modern Software Works</title>
  <style>
    :root {
      --bg:      oklch(98% 0.004 95);
      --surface: oklch(100% 0.002 95);
      --fg:      oklch(20% 0.018 70);
      --muted:   oklch(48% 0.012 70);
      --border:  oklch(90% 0.006 95);
      --accent:  oklch(52% 0.10 28);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'IBM Plex Mono', 'JetBrains Mono', Menlo, monospace;

      --on-field:        oklch(96% 0.012 95);
      --on-field-muted:  oklch(82% 0.016 95);
      --accent-ink:      oklch(98% 0.008 95);
      --accent-hover:    oklch(44% 0.11 28);
      --accent-active:   oklch(38% 0.10 28);
      --focus:           oklch(78% 0.08 95);
      --field-ink:       oklch(14% 0.012 240);
    }

    html[lang="ja"] {
      --font-display: 'Hiragino Mincho ProN', 'Yu Mincho', 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      color-scheme: dark;
      overflow-x: clip;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--field-ink);
      color: var(--on-field);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    body {
      overflow-x: clip;
      -webkit-tap-highlight-color: transparent;
    }

    .skip {
      position: absolute;
      left: max(16px, env(safe-area-inset-left));
      top: max(12px, env(safe-area-inset-top));
      z-index: 8;
      padding: 10px 14px;
      min-height: 44px;
      background: var(--surface);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 550;
      letter-spacing: 0.02em;
      text-decoration: none;
      transform: translateY(-160%);
    }
    .skip:focus {
      transform: none;
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      background: var(--field-ink);
    }

    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(120% 80% at 72% 18%, oklch(30% 0.045 165 / 0.42), transparent 52%),
        radial-gradient(90% 70% at 20% 80%, oklch(22% 0.03 300 / 0.35), transparent 50%),
        var(--field-ink);
    }
    body.is-fallback .fallback { display: block; }
    body.is-fallback #gl { display: none; }

    .shell {
      position: relative;
      z-index: 2;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding:
        max(22px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
      pointer-events: none;
    }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: linear-gradient(
        102deg,
        oklch(14% 0.012 240 / 0.72) 0%,
        oklch(14% 0.012 240 / 0.38) 28%,
        oklch(14% 0.012 240 / 0.08) 48%,
        transparent 64%
      );
    }
    .top,
    .stage {
      position: relative;
      z-index: 1;
    }
    .shell a,
    .shell button {
      pointer-events: auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--on-field);
      text-decoration: none;
      min-width: 0;
    }
    .brand:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 6px;
    }

    .mark {
      width: 88px;
      height: 72px;
      flex: 0 0 auto;
      color: var(--on-field);
    }
    .mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wordmark {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(16px, 1.6vw, 19px);
      letter-spacing: 0.01em;
      line-height: 1.2;
      min-width: 0;
    }

    .langs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }
    .langs button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--on-field-muted);
      min-height: 44px;
      min-width: 44px;
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .langs button[data-lang="ja"] {
      text-transform: none;
      letter-spacing: 0.04em;
      font-size: 12px;
    }
    .langs button:hover,
    .langs button:active,
    .langs button[aria-current="true"] {
      color: var(--on-field);
    }
    .langs button[aria-current="true"] {
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .langs button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .stage {
      display: flex;
      align-items: flex-end;
      padding: 10vh 0 6vh;
      max-width: 38rem;
    }

    .copy { max-width: 34rem; }

    .headline {
      margin: 0 0 18px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--on-field);
      text-wrap: balance;
    }

    .deck {
      margin: 0 0 28px;
      max-width: 42ch;
      font-size: 17px;
      line-height: 1.55;
      color: var(--on-field-muted);
      text-wrap: pretty;
    }

    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .cta-note {
      margin: 0;
      color: var(--on-field-muted);
      font-family: var(--font-body);
      font-size: 13px;
      letter-spacing: 0.01em;
      line-height: 1.45;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .cta-note:link,
    .cta-note:visited {
      color: var(--on-field-muted);
    }
    .cta-note:hover,
    .cta-note:hover:visited {
      color: var(--on-field);
    }
    .cta-note:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    html[lang="it"] .headline {
      font-size: clamp(32px, 4.6vw, 54px);
      letter-spacing: -0.02em;
      line-height: 1.14;
    }
    html[lang="it"] .deck { hyphens: auto; }

    html[lang="ja"] .langs button:not([data-lang="ja"]) {
      letter-spacing: 0.08em;
    }
    html[lang="ja"] .headline {
      font-size: clamp(30px, 4.8vw, 52px);
      line-height: 1.34;
      letter-spacing: 0;
      line-break: strict;
    }
    html[lang="ja"] .deck {
      max-width: 26em;
      line-height: 1.75;
      letter-spacing: 0;
    }
    html[lang="ja"] .cta {
      letter-spacing: 0;
      line-height: 1.5;
      line-break: strict;
    }

    .cta {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      min-height: 44px;
      max-width: min(22rem, 100%);
      padding: 12px 22px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 560;
      letter-spacing: 0.02em;
      line-height: 1.35;
      cursor: pointer;
      border-radius: 0;
      text-decoration: none;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }
    .cta:link,
    .cta:visited {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .cta:hover,
    .cta:hover:visited {
      background: var(--accent-hover);
      color: var(--accent-ink);
    }
    .cta:active,
    .cta:active:visited {
      background: var(--accent-active);
      color: var(--accent-ink);
    }
    .cta:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    ::selection {
      background: oklch(96% 0.012 95 / 0.18);
      color: var(--on-field);
    }

    @media (max-width: 720px) {
      .shell {
        padding:
          max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }
      .shell::before {
        background: linear-gradient(
          180deg,
          oklch(14% 0.012 240 / 0.22) 0%,
          oklch(14% 0.012 240 / 0.48) 46%,
          oklch(14% 0.012 240 / 0.72) 100%
        );
      }
      .wordmark { font-size: 15px; }
      .mark { width: 64px; height: 52px; }
      .brand { gap: 12px; }
      .stage { padding: 8vh 0 4vh; }
      .headline { font-size: clamp(32px, 9.4vw, 48px); }
      html[lang="it"] .headline,
      html[lang="ja"] .headline { font-size: clamp(28px, 8vw, 40px); }
      .deck { font-size: 16px; max-width: 36ch; }
      .langs button { padding: 0 6px; letter-spacing: 0.08em; }
    }

    @media (max-width: 420px) {
      .mark { width: 56px; height: 46px; }
      .wordmark { font-size: 14px; }
      .cta { text-align: center; }
      .langs button { min-width: 40px; padding: 0 4px; }
    }

    @media (max-height: 720px) {
      .stage { padding: 4vh 0 2vh; }
      .headline { font-size: clamp(30px, 4.6vw, 48px); }
      .deck { margin-bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var I18N = {
        en: {
          htmlLang: 'en',
          title: 'Modern Software Works',
          brandName: 'Modern Software Works',
          headline: 'We build the software you intend to ship',
          deck: 'Few commissions. From first sketch to a product people use, then systems that keep it running.',
          cta: 'I have a product to build',
          ctaNote: 'hello@modernsoftware.works',
          langLabel: 'Language',

        },

          deck: 'Pochi incarichi. Dal primo schizzo a un prodotto che si usa, poi i sistemi che restano dopo il lancio.',
          cta: 'Ho un prodotto da costruire',
          ctaNote: 'hello@modernsoftware.works',
          langLabel: 'Lingua',
          skip: 'Vai alla mail',
          langSpoken: 'Italiano',
          mailHref: 'mailto:hello@modernsoftware.works?subject=' + encodeURIComponent('Ho un prodotto da costruire') + '&body=' + encodeURIComponent('Cosa volete costruire, per chi, e quando volete vederlo nel mondo.')
        },
        ja: {
          htmlLang: 'ja',
          title: 'Modern Software Works',
          brandName: 'Modern Software Works',
          headline: 'つくろうとしているソフトウェアを、かたちにします',
          deck: '同時に少数のみ。最初のスケッチから使えるプロダクトまで。公開のあとも動く仕組みを残します。',
          cta: 'このプロダクトをつくってほしい',
          ctaNote: 'hello@modernsoftware.works',
          langLabel: '言語',
          skip: 'メールへ',
          langSpoken: '日本語',
          mailHref: 'mailto:hello@modernsoftware.works?subject=' + encodeURIComponent('このプロダクトをつくってほしい') + '&body=' + encodeURIComponent('つくろうとしているもの、誰のためのものか、いつ世に出したいのかを、短く書いてください。')
        }
      };

      var canvas = document.getElementById('gl');
      var langNav = document.querySelector('[data-od-id="lang-switcher"]');
      var langStatus = document.getElementById('lang-status');
      var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      var reduce = reduceQuery.matches;
      var mouse = [0.62, 0.38];
      var start = performance.now();
      var running = false;

      function applyLocale(lang) {
        if (!I18N[lang]) lang = 'en';
        try { localStorage.setItem('msw-lang', lang); } catch (e) {}
        var p = I18N[lang];
        document.documentElement.lang = p.htmlLang;
        document.title = p.title;
        if (langNav) langNav.setAttribute('aria-label', p.langLabel);
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (p[key] != null) el.textContent = p[key];
        });
        document.querySelectorAll('[data-mail]').forEach(function (el) {
          if (p.mailHref) el.setAttribute('href', p.mailHref);
        });
        document.querySelectorAll('[data-lang]').forEach(function (btn) {
          var on = btn.getAttribute('data-lang') === lang;
          btn.setAttribute('aria-current', on ? 'true' : 'false');
        });
        if (langStatus) langStatus.textContent = p.langSpoken;
      }

      var navLang = ((navigator.language || 'en').slice(0, 2) || 'en').toLowerCase();
      var saved = null;
      try { saved = localStorage.getItem('msw-lang'); } catch (e) {}
      applyLocale(saved || (I18N[navLang] ? navLang : 'en'));

      document.querySelectorAll('[data-lang]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          applyLocale(btn.getAttribute('data-lang'));
        });
      });

      function showFallback() {
        document.body.classList.add('is-fallback');
        var fb = document.querySelector('[data-od-id="webgl-fallback"]');
        if (fb) fb.hidden = false;
      }

      var vertSrc = [
        '#version 300 es',
        'precision highp float;',
        'const vec2 V[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));',
        'void main(){ gl_Position = vec4(V[gl_VertexID], 0.0, 1.0); }'
      ].join('\n');

      var fragSrc = [
        '#version 300 es',
        'precision highp float;',
        'uniform vec2 u_res;',
        'uniform float u_time;',
        'uniform vec2 u_mouse;',
        'out vec4 outColor;',
        'float hash(vec2 p){',
        '  p = fract(p * vec2(123.34, 456.21));',
        '  p += dot(p, p + 45.32);',
        '  return fract(p.x * p.y);',
        '}',
        'float noise(vec2 p){',
        '  vec2 i = floor(p);',
        '  vec2 f = fract(p);',
        '  f = f * f * (3.0 - 2.0 * f);',
        '  float a = hash(i);',
        '  float b = hash(i + vec2(1.0, 0.0));',
        '  float c = hash(i + vec2(0.0, 1.0));',
        '  float d = hash(i + vec2(1.0, 1.0));',
        '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
        '}',
        'float fbm(vec2 p){',
        '  float v = 0.0;',
        '  float a = 0.5;',
        '  for (int i = 0; i < 6; i++){',
        '    v += a * noise(p);',
        '    p = p * 2.07 + vec2(1.7, 9.2);',
        '    a *= 0.5;',
        '  }',
        '  return v;',
        '}',
        'void main(){',
        '  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;',
        '  float t = u_time * 0.065;',
        '  vec2 m = (u_mouse - 0.5) * 0.35;',
        '  vec2 p = uv + m * 0.15;',
        '  float warp = fbm(p * vec2(1.15, 0.42) + vec2(t * 0.55, t * 0.18));',
        '  float curtains = fbm(vec2(p.x * 1.35 + warp * 1.8, p.y * 0.28 - t));',
        '  float ribbons = fbm(vec2(p.x * 0.55 - t * 0.4, p.y * 0.9 + warp));',
        '  float height = smoothstep(-0.95, 0.05, uv.y) * smoothstep(1.15, -0.05, uv.y);',
        '  float sheet = pow(max(curtains * 0.78 + ribbons * 0.34, 0.0), 1.55) * height;',
        '  float edge = pow(sheet, 6.5);',
        '  vec3 deep = vec3(0.043, 0.048, 0.052);',
        '  vec3 teal = vec3(0.10, 0.34, 0.32);',
        '  vec3 leaf = vec3(0.30, 0.70, 0.46);',
        '  vec3 violet = vec3(0.22, 0.14, 0.34);',
        '  vec3 warm = vec3(0.72, 0.42, 0.28);',
        '  vec3 col = deep;',
        '  col = mix(col, teal, sheet * 0.92);',
        '  col = mix(col, leaf, pow(sheet, 2.1) * 0.62);',
        '  col += violet * pow(max(ribbons, 0.0), 3.0) * height * 0.28;',
        '  col += warm * edge * 0.22;',
        '  float stars = step(0.996, hash(gl_FragCoord.xy * 0.37));',
        '  col += stars * (1.0 - height * 0.65) * 0.35;',
        '  float vig = smoothstep(1.35, 0.15, length(uv * vec2(0.72, 1.0)));',
        '  col *= mix(0.55, 1.0, vig);',
        '  float grain = (hash(gl_FragCoord.xy + t) - 0.5) * 0.028;',
        '  col += grain;',
        '  outColor = vec4(col, 1.0);',
        '}'
      ].join('\n');

      function compile(gl, type, src) {
        var sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(sh));
          gl.deleteShader(sh);
          return null;
        }
        return sh;
      }

      var gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false });
      if (!gl) {
        showFallback();
        return;
      }

      var vs = compile(gl, gl.VERTEX_SHADER, vertSrc);
      var fs = compile(gl, gl.FRAGMENT_SHADER, fragSrc);
      if (!vs || !fs) {
        showFallback();
        return;
      }

      var prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(prog));
        showFallback();
        return;
      }
      gl.useProgram(prog);
      var locRes = gl.getUniformLocation(prog, 'u_res');
      var locTime = gl.getUniformLocation(prog, 'u_time');
      var locMouse = gl.getUniformLocation(prog, 'u_mouse');
      var vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(1, Math.floor(window.innerWidth * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
      }

      var first = true;
      function draw(now) {
        resize();
        var t = reduce ? 4.8 : (now - start) / 1000;
        gl.uniform2f(locRes, canvas.width, canvas.height);
        gl.uniform1f(locTime, t);
        gl.uniform2f(locMouse, mouse[0], mouse[1]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (first) {
          var err = gl.getError();
          if (err !== gl.NO_ERROR) console.error('WebGL error', err);
          first = false;
        }
      }

      function tick(now) {
        running = true;
        draw(now);
        if (reduce || document.hidden) {
          running = false;
          return;
        }
        requestAnimationFrame(tick);
      }

      function startLoop() {
        if (running || reduce || document.hidden) {
          draw(performance.now());
          return;
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', function () {
        draw(performance.now());
      });
      window.addEventListener('pointermove', function (e) {
        mouse[0] = e.clientX / Math.max(window.innerWidth, 1);
        mouse[1] = 1.0 - e.clientY / Math.max(window.innerHeight, 1);
      }, { passive: true });

      if (reduceQuery.addEventListener) {
        reduceQuery.addEventListener('change', function (e) {
          reduce = e.matches;
          startLoop();
        });
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) startLoop();
      });

      startLoop();
    })();
  </script>
</body>
</html>
