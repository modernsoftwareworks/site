pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,mjs,cjs,astro,css,json,jsonc}"
      run: ./node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    fallow:
      run: ./node_modules/.bin/fallow dead-code
